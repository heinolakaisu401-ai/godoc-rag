services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: godoc_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表（只在数据卷为空时执行一次）
      - ./scripts/setup.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d godoc_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_MODEL: qwen-plus
      EMBED_MODEL: text-embedding-v3
      EMBED_DIM: "1024"
      DATABASE_URL: postgres://postgres:postgres@db:5432/godoc_rag?sslmode=disable
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
